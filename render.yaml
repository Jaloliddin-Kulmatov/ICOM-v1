# Backend only. The frontend is deployed on Vercel (see vercel.json) and the
# database is Neon Postgres (free tier), connected through DATABASE_URL.
services:
  - type: web
    name: icom-backend
    runtime: python
    region: singapore          # closest Render region to Korea
    rootDir: backend
    plan: free
    # bootstrap.py creates tables and seeds data once per deploy, so the web
    # process itself starts fast (free instances sleep and cold-start often).
    buildCommand: pip install -r requirements-render.txt && python bootstrap.py
    # One worker keeps APScheduler from running twice; threads handle concurrency.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: STARTUP_TASKS
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # Neon connection string (postgresql://...?sslmode=require)
      - key: FRONTEND_URL
        sync: false          # https://icom.ai.kr,https://www.icom.ai.kr
      - key: GROQ_API_KEY
        sync: false
      - key: SCRAPER_SECRET
        sync: false          # same value as the ICOM_API_URL/SCRAPER_SECRET GitHub secrets
      - key: ADMIN_SECRET
        sync: false
      - key: SARAMIN_API_KEY
        sync: false          # optional
      - key: RESEND_API_KEY
        sync: false          # optional: job-alert emails
      - key: RESEND_FROM
        sync: false          # optional
