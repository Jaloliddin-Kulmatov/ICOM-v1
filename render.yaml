# Backend only. The frontend is deployed on Vercel (see vercel.json) and the
# database is Supabase Postgres (free tier, Singapore), connected through DATABASE_URL.
#
# To (re)create the server: Render → New → Blueprint → pick this repo. Render reads
# this file, asks for the values marked sync:false, and builds it in Singapore,
# next to the database. Region can't be changed later, only by creating a new service.
services:
  - type: web
    name: icom-backend
    runtime: python
    region: singapore          # closest Render region to Korea
    rootDir: backend
    plan: starter              # always on: no 30–60 s wake-up after idle time
    # bootstrap.py creates tables and seeds data once per deploy, so the web
    # process itself starts fast.
    buildCommand: pip install -r requirements.txt && python bootstrap.py
    # One worker keeps APScheduler from running twice; threads handle concurrency.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: STARTUP_TASKS
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # Supabase session pooler string (postgresql://...pooler.supabase.com:5432/postgres?sslmode=require)
      - key: FRONTEND_URL
        sync: false          # https://icom.ai.kr,https://www.icom.ai.kr
      - key: GROQ_API_KEY
        sync: false
      - key: SCRAPER_SECRET
        sync: false          # same value as the ICOM_API_URL/SCRAPER_SECRET GitHub secrets
      - key: ADMIN_SECRET
        sync: false
      - key: SARAMIN_API_KEY
        sync: false          # optional
      - key: GOOGLE_CLIENT_ID
        sync: false          # Google sign-in: the website's OAuth client ID (public); comma-separate to add app IDs
      - key: RESEND_API_KEY
        sync: false          # optional: job-alert emails
      - key: RESEND_FROM
        sync: false          # optional: e.g. ICOM <no-reply@icom.ai.kr> once the domain is verified in Resend
      - key: SENDER_EMAIL
        sync: false          # optional Gmail fallback for emails
      - key: SENDER_PASSWORD
        sync: false          # Gmail app password (not the account password)
