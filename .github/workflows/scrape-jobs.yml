name: Sync internships

on:
  schedule:
    - cron: "0 6 * * *"   # 3 PM KST
    - cron: "0 18 * * *"  # 3 AM KST
  workflow_dispatch:        # "Run workflow" button in the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests==2.32.3 groq==0.9.0 httpx==0.27.0

      - name: Sync internships with Wanted
        env:
          ICOM_API_URL: ${{ secrets.ICOM_API_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WANTED_QUERY: "인턴"
          WANTED_PAGES: "2"
          NEW_LIMIT: "40"
          TRANSLATE_LIMIT: "60"
          TIME_BUDGET_MIN: "22"
        run: python scraper/daemon.py
