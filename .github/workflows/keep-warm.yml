name: Keep backend awake

# Render's free plan puts the backend to sleep after 15 minutes without
# traffic, and the next visitor then waits 30-60 s for it to boot. A light
# ping every 10 minutes keeps it awake (one always-on service fits inside
# the free plan's 750 hours a month). /api/health doesn't touch the database.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://icom-v1.onrender.com/api/health
